<script id="hk-mob-rail-js">/* ===================================================================
   HASOKEY - MASA YATAY MOBIL DUZEN (canli enjeksiyon)  id: hk-mob-rail
   - Sadece dokunmatik (pointer:coarse) + YATAY.
   - Masaustu/Electron ve dikey: HIC dokunmaz.
   - React dugumlerini TASIMAZ; sadece class/CSS + dinamik scale.
   =================================================================== */
(function(){
  if (window.__hkMobRail) return; window.__hkMobRail = 1;
  var D = document, root = D.documentElement;

  function isTouch(){ return window.matchMedia('(pointer: coarse)').matches; }
  function isLandscape(){ return window.innerWidth > window.innerHeight; }

  /* Masa sayfasini bul: felt-bg icinde cq-row olan ana kapsayici */
  function findMasa(){
    var rows = D.querySelectorAll('.cq-row');
    for (var i=0;i<rows.length;i++){
      var r = rows[i];
      if (r.querySelector('.klasik-masa')) return r;
    }
    return null;
  }
  /* game-stage (scale uygulanan kat) */
  function findStage(){ return D.querySelector('.game-stage'); }

  /* ---- UI iskeleti (body'e eklenir, React disinda) ---- */
  var TOP, RAIL, built=false;
  function build(){
    if (built) return; built=true;

    TOP = D.createElement('div'); TOP.id='hk-top';
    TOP.innerHTML =
      '<span class="kat"><span>Kat</span><select id="hk-kat"><option>1</option><option>2</option><option>3</option></select></span>'+
      '<span class="who">\uD83D\uDC64 <span id="hk-uname">\u2014</span></span>'+
      '<span class="salon">\uD83C\uDFE0 <span id="hk-salon">\u2014</span></span>'+
      '<span class="vtag">YEN\u0130 v54</span>';
    D.body.appendChild(TOP);

    RAIL = D.createElement('div'); RAIL.id='hk-rail';
    RAIL.innerHTML =
      '<button data-k="masa" class="on"><span class="ic">\uD83C\uDFB4</span>Masa</button>'+
      '<button data-k="users"><span class="ic">\uD83D\uDC65</span>Kullan\u0131c\u0131<br>Top 10</button>'+
      '<button data-k="chat"><span class="ic">\uD83D\uDCAC</span>Sohbet</button>'+
      '<span class="sp"></span>'+
      '<button data-k="exit" class="exit"><span class="ic">\uD83D\uDEAA</span>\u00C7\u0131k\u0131\u015f</button>';
    D.body.appendChild(RAIL);

    var bs = RAIL.querySelectorAll('button');
    for (var i=0;i<bs.length;i++){
      (function(b){
        b.addEventListener('click', function(){
          var k=b.getAttribute('data-k');
          if (k==='exit'){ doExit(); return; }
          setTab(k);
        });
      })(bs[i]);
    }
  }

  function setTab(k){
    root.setAttribute('data-hkmasa', k);
    if (!RAIL) return;
    var bs=RAIL.querySelectorAll('button[data-k]');
    for (var i=0;i<bs.length;i++){
      var dk=bs[i].getAttribute('data-k');
      if (dk==='exit') continue;
      bs[i].classList.toggle('on', dk===k);
    }
  }

  /* Gercek 'Masadan cik' butonuna bas */
  function doExit(){
    var sels = ['button[title*="Masadan"]','button[title*="cik"]','button[title*="\u00c7\u0131k"]'];
    for (var s=0;s<sels.length;s++){
      var b = D.querySelector(sels[s]);
      if (b){ b.click(); return; }
    }
    var topx = D.querySelector('button.hover\\:text-red-500');
    if (topx) topx.click();
  }

  /* Ust bar bilgisini doldur: nick + salon/masa adi */
  function fillTop(){
    if (!TOP) return;
    var title = D.querySelector('.bg-black.text-white .truncate, .bg-black .truncate');
    var uname = '\u2014', salon='\u2014';
    if (title){
      var t = title.textContent || '';
      var m = t.match(/\]\s*\[\s*([^\]\[]+?)\s*\]/);
      if (m) uname = m[1].trim();
      var first = t.split('[')[0].trim();
      salon = first || t.trim().slice(0,28);
    }
    var un=D.getElementById('hk-uname');
    if (un && un.textContent!==uname) un.textContent=uname;
    var sl=D.getElementById('hk-salon');
    if (sl && sl.textContent!==salon) sl.textContent=salon;
  }

  /* game-stage scale'ini bizim alana (ekran geni\u015fli\u011fi) oturt: yatayda tam geni\u015flik */
  function fitStage(){
    var stage = findStage();
    if (!stage) return;
    var parent = stage.parentElement;
    // tasarim geni\u015fli\u011fi (inline width)
    var designW = parseFloat(stage.style.width) || stage.scrollWidth || 1180;
    var availW = window.innerWidth;          // rail/top CSS ile hesaba katiliyor; stage tam geni\u015flik
    var scale = availW / designW;
    stage.style.transform = 'scale('+scale+')';
    stage.style.transformOrigin = 'top left';
    if (parent){
      var h = Math.ceil((stage.scrollHeight||720) * scale);
      parent.style.height = h + 'px';
      parent.style.overflow = 'visible';
    }
  }

  var active=false;
  function apply(){
    var on = isTouch() && isLandscape() && !!findMasa();
    if (on){
      build();
      root.setAttribute('data-hkmob','1');
      if (!root.getAttribute('data-hkmasa')) setTab('masa');
      TOP.style.display=''; RAIL.style.display='';
      fillTop();
      fitStage();
      active=true;
    } else {
      root.removeAttribute('data-hkmob');
      root.removeAttribute('data-hkmasa');
      if (TOP) TOP.style.display='none';
      if (RAIL) RAIL.style.display='none';
      active=false;
    }
  }

  // ilk calistir + olaylar
  function boot(){ apply(); }
  if (D.readyState==='loading') D.addEventListener('DOMContentLoaded', boot); else boot();
  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', function(){ setTimeout(apply,120); });

  /* React yeni DOM cizdikce (masa acilinca) tekrar degerlendir.
     ONEMLI: kendi dugumlerimizin (hk-top/hk-rail) ve textContent
     yazmalarimizin tetikledigi mutasyonlari YOK SAY -> sonsuz dongu olmaz.
     Ayrica debounce ile isi azalt. */
  var mo=null, pending=0;
  function ownNode(n){
    while(n){ if(n.id==='hk-top'||n.id==='hk-rail') return true; n=n.parentNode; }
    return false;
  }
  function schedule(){
    if (pending) return;
    pending = setTimeout(function(){ pending=0; apply(); }, 150);
  }
  try {
    mo = new MutationObserver(function(muts){
      if (!isTouch()) return;
      for (var i=0;i<muts.length;i++){
        if (!ownNode(muts[i].target)) { schedule(); return; }
      }
    });
    mo.observe(D.body,{childList:true,subtree:true});
  } catch(e){}

  // React scale'ini yeniden ezmek icin hafif periyodik fit (textContent
  // yazmadan once mevcut degerle ayni ise degistirmeyiz -> observer sakin).
  setInterval(function(){ if(active){ fitStage(); fillTop(); } }, 600);
})();
</script>
<script id="hk-auto-lobi">
(function(){
  if(window.__hkAutoLobi) return; window.__hkAutoLobi=1;
  // Istenirse tanitim sayfasinda kal: ?site=1
  try{ if(new URLSearchParams(location.search).get('site')==='1') return; }catch(e){}
  var done=false, tries=0;
  function findBtn(){
    var els=document.querySelectorAll('button, a, [role=\"button\"]');
    for(var i=0;i<els.length;i++){
      var t=(els[i].textContent||'').replace(/\s+/g,' ').trim();
      if(/Taray[\u0131i]c[\u0131i]dan\s*Oyna/i.test(t)) return els[i];
    }
    return null;
  }
  function tick(){
    if(done) return; tries++;
    var b=findBtn();
    if(b){
      b.click();
      setTimeout(function(){ if(findBtn() && tries<40){ tick(); } else { done=true; } },700);
      return;
    }
    if(tries<40) setTimeout(tick,250);
  }
  function boot(){ setTimeout(tick,600); }
  if(document.readyState!=='loading') boot();
  else document.addEventListener('DOMContentLoaded',boot);
})();
</script>
